name: Validate Project

# PR status checks only — scheduled agent runs live on Railway (railway.json + start.sh)
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit checks (ruff, prettier, hygiene)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Compile all modules
        run: python -m compileall -q agent job-connect.py

      - name: Validate config and imports
        run: |
          python - <<'EOF'
          import yaml, pathlib

          cfg = yaml.safe_load(pathlib.Path("config.yaml").read_text())
          assert cfg.get("boards"), "config.yaml: no boards configured"
          assert cfg.get("profile", {}).get("name"), "config.yaml: profile.name is empty"

          # import smoke test (no network, no browser)
          from agent.config import Config
          from agent.models import Job
          from agent.evaluator import JobEvaluation
          from agent.tailor import ApplicationPackage
          from agent import applier, knowledge, notifier, scraper, tracker

          c = Config()
          assert c.apply_mode in ("alert", "draft", "auto")
          resume = pathlib.Path("profile/master-resume.md").read_text()
          assert len(resume) > 500, "master resume looks empty"
          print("config, imports, and master resume OK")
          EOF
