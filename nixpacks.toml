# Railway/Nixpacks build config: install Chromium (and its system libs) for
# Playwright after pip dependencies are installed. git is needed at runtime by
# start.sh to sync the Obsidian vault repo.

[phases.setup]
aptPkgs = [
  "git",
  "libnss3", "libnspr4", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2",
  "libdrm2", "libxkbcommon0", "libxcomposite1", "libxdamage1", "libxfixes3",
  "libxrandr2", "libgbm1", "libasound2t64", "libpango-1.0-0", "libcairo2",
]

[phases.build]
cmds = ["python -m playwright install chromium"]
